name: C5-REA Zero-Waste CI Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js for Optional JS Recovery Suite
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Provision Ephemeral JS Toolchain
      run: |
        mkdir -p /tmp/c5_js_toolchain
        cd /tmp/c5_js_toolchain
        npm init -y
        npm install --silent @babel/generator@^7.26.0 @babel/parser@^7.26.0 @babel/types@^7.26.0

    - name: Run Full Deterministic Unit & Differential Suite (51/51 tests)
      env:
        C5_REA_JS_TOOLCHAIN: /tmp/c5_js_toolchain
      run: |
        python3 -m unittest discover -s tests -p "test_*.py" -v

    - name: Run Existence-Gap Self-Audit (0% Slop / 0% Phantom Imports)
      run: |
        python3 c5_rea_cli.py existence-gap .
